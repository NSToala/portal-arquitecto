name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng build --configuration production --base-href /portal-arquitecto/
      # GitHub Pages no reenvía las rutas internas a index.html: 404.html hace ese papel
      - run: cp dist/portal-arquitecto/browser/index.html dist/portal-arquitecto/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portal-arquitecto/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
